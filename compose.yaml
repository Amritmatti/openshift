services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: employees
      POSTGRES_PASSWORD: local-development-password
    volumes:
      - employee-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employees -d employees"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: employees
      DB_USER: employees
      DB_PASSWORD: local-development-password
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "8080:8080"
volumes:
  employee-db-data:
    name: employee-db-data
