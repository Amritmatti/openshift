<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Directory</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1>Employee Directory</h1><p>Add and manage employee records. Records are stored in PostgreSQL.</p>
<form id="employee-form"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Date of birth<input name="dateOfBirth" type="date" required></label><label>Location<input name="location" required></label><label>Department<input name="department" required></label><label>Job title<input name="jobTitle" required></label><button>Add employee</button></form>
<p id="message" role="status"></p><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>DOB</th><th>Location</th><th>Department</th><th>Title</th><th></th></tr></thead><tbody id="employees"></tbody></table></main><script src="app.js"></script></body></html>
